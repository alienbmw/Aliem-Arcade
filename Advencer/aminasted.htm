<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
</head>
<body>

    <h1>Agregar Juego</h1>

    <form id="gameForm">
        <label>Nombre:</label><br>
        <input type="text" id="name" required><br><br>

        <label>Categoría:</label><br>
        <input type="text" id="category" required><br><br>

        <label>Descripción:</label><br>
        <textarea id="description"></textarea><br><br>

        <label>Imagen URL:</label><br>
        <input type="text" id="image"><br><br>

        <button type="submit">Guardar</button>
    </form>

    <p id="msg"></p>

    <script>
        document.getElementById("gameForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const game = {
                name: document.getElementById("name").value,
                category: document.getElementById("category").value,
                description: document.getElementById("description").value,
                image: document.getElementById("image").value
            };

            const response = await fetch("https://tu-api.onrender.com/games", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(game)
            });

            if(response.ok){
                document.getElementById("msg").textContent = "Juego guardado correctamente";
                document.getElementById("gameForm").reset();
            }
        });
    </script>

</body>
</html>
